<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>綠葉放貸儀表板 🍃</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root { --green: #16a34a; --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid #334155; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  select, button, input { background: var(--card); color: var(--text); border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  button { cursor: pointer; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; }
  .card .label { color: var(--muted); font-size: 13px; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 6px; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .green { color: var(--green); }
  section { margin-top: 28px; }
  h2 { font-size: 16px; color: var(--muted); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
  th, td { padding: 10px 14px; text-align: right; font-size: 14px; }
  th { background: #263548; color: var(--muted); font-weight: 500; }
  th:first-child, td:first-child { text-align: left; }
  tr + tr td { border-top: 1px solid #2c3d52; }
  .empty { color: var(--muted); padding: 18px; text-align: center; }
  #chartWrap { background: var(--card); border-radius: 12px; padding: 16px; height: 280px; }
  #error { color: #f87171; margin: 12px 0; white-space: pre-wrap; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #14532d; color: #86efac; }
  .badge.idle { background: #334155; color: var(--muted); }
  .badge.dry { background: #78350f; color: #fcd34d; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 20px; }
  /* 參數設定 */
  .ccyBox { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .ccyBox h3 { margin: 0 0 12px; font-size: 15px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 18px; }
  .field { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .field label { flex: 1; color: var(--muted); }
  .field input[type=number] { width: 110px; text-align: right; }
  .field .apr { color: var(--green); font-size: 12px; width: 62px; text-align: right; }
  .note { color: var(--muted); font-size: 12px; margin: 6px 0 14px; line-height: 1.7; }
  #cfgJson { width: 100%; height: 200px; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
             background: #0b1120; color: #a5b4c8; border: 1px solid #334155; border-radius: 10px; padding: 12px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .actions a { text-decoration: none; }
  .primary { background: var(--green); border: none; color: #fff; font-weight: 600; }
  #cfgLock { background: var(--card); border-radius: 12px; padding: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #cfgLock input { width: 200px; }
  #cfgErr { color: #f87171; font-size: 13px; }
  /* 執行紀錄 */
  details.run { background: var(--card); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  details.run summary { padding: 12px 16px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: 14px; list-style: none; }
  details.run summary::-webkit-details-marker { display: none; }
  details.run pre { margin: 0; padding: 12px 16px; background: #0b1120; font-size: 12px; overflow-x: auto; white-space: pre-wrap; color: #a5b4c8; }
  .runTime { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>🍃 綠葉放貸儀表板</h1>
  <select id="ccy"></select>
  <button onclick="refresh()">重新整理</button>
</header>
<main>
  <div id="error"></div>
  <div class="cards">
    <div class="card"><div class="label">Funding 錢包總額</div><div class="value" id="balance">–</div><div class="sub" id="available"></div></div>
    <div class="card"><div class="label">放貸中(已成交)</div><div class="value green" id="lentTotal">–</div><div class="sub" id="lentRate"></div></div>
    <div class="card"><div class="label">今日利息</div><div class="value green" id="today">–</div><div class="sub" id="d7"></div></div>
    <div class="card"><div class="label">近 30 日利息</div><div class="value green" id="d30">–</div><div class="sub" id="estApr"></div></div>
  </div>
  <section>
    <h2>每日利息(近 60 天)</h2>
    <div id="chartWrap"><canvas id="chart"></canvas></div>
  </section>
  <section>
    <h2>放貸中部位</h2>
    <div id="lentTable"></div>
  </section>
  <section>
    <h2>掛單中(等待成交)</h2>
    <div id="offerTable"></div>
  </section>
  <section>
    <h2>參數設定</h2>
    <div id="cfgLock">
      <span>🔒 修改參數需要密碼</span>
      <input id="cfgPw" type="password" placeholder="設定密碼">
      <button class="primary" onclick="unlockSettings()">解鎖</button>
      <span id="cfgErr"></span>
    </div>
    <div id="cfgPanel" hidden>
      <div class="note">
        改動下方欄位會即時產生新的 <code>config.json</code>。按「複製設定」後點「在 GitHub 編輯」,
        在編輯器裡全選貼上並 Commit,下一輪(15 分鐘內)機器人就會套用。<br>
        這個頁面<b>不會、也不能</b>直接改動 repo —— 寫入權限一律走你自己的 GitHub 登入。
      </div>
      <div id="cfgForm"></div>
      <textarea id="cfgJson" readonly spellcheck="false"></textarea>
      <div class="actions">
        <button class="primary" onclick="copyCfg()">複製設定</button>
        <a href="https://github.com/ChiJiun/bitfinex-lending-bot/edit/master/config.json"
           target="_blank" rel="noopener"><button>在 GitHub 編輯 ↗</button></a>
        <button onclick="renderSettings(true)">還原成目前設定</button>
      </div>
    </div>
  </section>
  <section>
    <h2>機器人執行紀錄(最近 50 次)</h2>
    <div id="runs"></div>
  </section>
</main>
<footer>資料由 GitHub Actions 每輪執行後發佈 · 資料時間 <span id="updated">–</span></footer>

<script>
let chart, payload;
const fmt = (n, d = 2) => Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const ts = ms => ms ? new Date(ms).toLocaleString("zh-TW", { hour12: false }) : "–";
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");

async function refresh() {
  const err = document.getElementById("error");
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (r.status === 404) throw new Error("尚無資料 — 等機器人在 GitHub Actions 跑完第一輪後就會出現");
    if (!r.ok) throw new Error("讀取 data.json 失敗: HTTP " + r.status);
    payload = await r.json();
    err.textContent = "";
  } catch (e) {
    err.textContent = "更新失敗:" + e.message;
    return;
  }
  render();
}

function table(headers, rows) {
  if (!rows.length) return '<div class="card empty">目前沒有資料</div>';
  return `<table><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr>` +
    rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") + "</table>";
}

function render() {
  const sel = document.getElementById("ccy");
  const currencies = Object.keys(payload.currencies || {});
  if (sel.options.length !== currencies.length) {
    const prev = sel.value;
    sel.innerHTML = currencies.map(c => `<option>${c}</option>`).join("");
    if (currencies.includes(prev)) sel.value = prev;
    sel.onchange = render;
  }
  const d = payload.currencies[sel.value || currencies[0]];
  const err = document.getElementById("error");
  if (d && d.error) err.textContent = "此幣別資料讀取失敗:" + d.error;

  if (d && !d.error) {
    document.getElementById("balance").textContent = fmt(d.balance) + " " + d.currency;
    document.getElementById("available").textContent = "閒置可掛出:" + fmt(d.available);
    document.getElementById("lentTotal").textContent = fmt(d.lent.total);
    document.getElementById("lentRate").textContent =
      d.lent.total ? `加權 ${fmt(d.lent.weighted_rate_pct, 4)}%/日 · 年化 ${fmt(d.lent.apr_pct, 1)}%` : "";
    document.getElementById("today").textContent = "+" + fmt(d.earnings.today, 4);
    document.getElementById("d7").textContent = "近 7 日:+" + fmt(d.earnings.d7, 2);
    document.getElementById("d30").textContent = "+" + fmt(d.earnings.d30, 2);
    document.getElementById("estApr").textContent = "估算年化 " + fmt(d.earnings.est_apr_pct, 1) + "%";

    document.getElementById("lentTable").innerHTML = table(
      ["狀態", "金額", "日利率", "年化", "天數", "開始", "到期"],
      d.lent.items.map(p => [
        p.used ? '<span class="badge">生息中</span>' : '<span class="badge idle">已提供</span>',
        fmt(p.amount), fmt(p.rate_pct, 4) + "%", fmt(p.apr_pct, 1) + "%",
        p.period, ts(p.opened_ms), ts(p.expires_ms),
      ]));

    document.getElementById("offerTable").innerHTML = table(
      ["掛單時間", "金額", "日利率", "年化", "天數"],
      d.offers.map(o => [ts(o.created_ms), fmt(o.amount), fmt(o.rate_pct, 4) + "%",
                         fmt(o.apr_pct, 1) + "%", o.period]));

    const labels = d.earnings.daily.map(x => x.date.slice(5));
    const values = d.earnings.daily.map(x => x.amount);
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("chart"), {
      type: "bar",
      data: { labels, datasets: [{ data: values, backgroundColor: "#16a34a", borderRadius: 3 }] },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#94a3b8", maxTicksLimit: 15 }, grid: { display: false } },
          y: { ticks: { color: "#94a3b8" }, grid: { color: "#2c3d52" } },
        },
      },
    });
  }

  document.getElementById("runs").innerHTML = (payload.runs || []).map(r => `
    <details class="run">
      <summary>
        <span>${r.ok ? "✅" : "❌"}</span>
        <span class="runTime">${ts(r.ts_ms)}</span>
        ${r.dry_run ? '<span class="badge dry">DRY RUN</span>' : ""}
      </summary>
      <pre>${esc(r.log || "(無輸出)")}</pre>
    </details>`).join("") || '<div class="card empty">尚無執行紀錄</div>';

  if (sessionStorage.getItem("cfgUnlocked") === "1") revealSettings();
  document.getElementById("updated").textContent = ts(payload.generated_ms);
}

/* ---------- 參數設定(需密碼) ----------
   密碼比對的是 workflow 用 Secret DASHBOARD_PASSWORD 產生、隨資料一起發佈的 PBKDF2 雜湊。
   這道檢查只在瀏覽器端執行,擋不住懂 DevTools 的人 —— 但設定頁本身不會寫入 repo,
   真正的寫入權限一律來自使用者自己的 GitHub 登入。                                  */

async function passwordOk(pw) {
  const g = payload && payload.password;
  if (!g) return false;
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: b64d(g.salt), iterations: g.iters, hash: "SHA-256" }, km, 256);
  return hex(bits) === hex(b64d(g.hash));
}

async function unlockSettings() {
  const errEl = document.getElementById("cfgErr");
  const pw = document.getElementById("cfgPw").value;
  errEl.textContent = "";
  if (!payload || !payload.password) {
    errEl.textContent = "這份資料沒有帶密碼設定 — 請確認 Secret DASHBOARD_PASSWORD 已設定";
    return;
  }
  if (!await passwordOk(pw)) { errEl.textContent = "密碼錯誤"; return; }
  sessionStorage.setItem("cfgUnlocked", "1");
  revealSettings();
}

function revealSettings() {
  document.getElementById("cfgLock").hidden = true;
  document.getElementById("cfgPanel").hidden = false;
  renderSettings(false);
}

const GLOBAL_FIELDS = [
  { key: "stale_offer_minutes", label: "一般掛單多久重新定價(分鐘)", min: 5, step: 5 },
];
const CCY_FIELDS = [
  { key: "enabled", label: "啟用此幣別", type: "bool" },
  { key: "max_lend_amount", label: "最大放貸總額(0 = 不限)", min: 0, step: 100 },
  { key: "reserve_amount", label: "保留不放貸的金額", min: 0, step: 50 },
  { key: "min_daily_rate_pct", label: "利率地板", type: "rate", min: 0, step: 0.001 },
  { key: "renew_min_daily_rate_pct", label: "續借門檻利率", type: "rate", min: 0, step: 0.001 },
  { key: "high_rate_stale_minutes", label: "高利率單等待(分鐘)", min: 5, step: 30 },
  { key: "renew_lookback_days", label: "續借回看天數", min: 1, step: 1 },
  { key: "market_anchor_percentile", label: "階梯下界(成交分位)", min: 0, max: 100, step: 5 },
  { key: "market_top_percentile", label: "階梯上界(成交分位)", min: 0, max: 100, step: 5 },
  { key: "num_ladder_steps", label: "階梯層數", min: 1, max: 20, step: 1 },
  { key: "min_offer_size", label: "單筆最小金額", min: 150, step: 10 },
  { key: "max_offer_size", label: "單筆最大金額", min: 150, step: 500 },
];

function fieldHtml(f, path, value) {
  const id = "f_" + path.replace(/\W/g, "_");
  if (f.type === "bool")
    return `<div class="field"><label for="${id}">${f.label}</label>
      <input type="checkbox" id="${id}" data-path="${path}" ${value ? "checked" : ""}></div>`;
  const attrs = [`min="${f.min ?? 0}"`, `step="${f.step ?? 1}"`, f.max != null ? `max="${f.max}"` : ""].join(" ");
  const apr = f.type === "rate" ? `<span class="apr" id="${id}_apr"></span>` : "";
  return `<div class="field"><label for="${id}">${f.label}</label>
    <input type="number" id="${id}" data-path="${path}" data-rate="${f.type === "rate" ? 1 : 0}"
           value="${value ?? 0}" ${attrs}>${apr}</div>`;
}

function renderSettings(reset) {
  const cfg = payload && payload.config;
  const host = document.getElementById("cfgForm");
  if (!cfg) { host.innerHTML = '<div class="card empty">這份資料還沒帶設定 — 等機器人下一輪跑完就會出現</div>'; return; }
  if (host.dataset.built && !reset) return;
  host.dataset.built = "1";

  let html = '<div class="ccyBox"><h3>全域</h3><div class="fields">' +
    GLOBAL_FIELDS.map(f => fieldHtml(f, f.key, cfg[f.key])).join("") + "</div></div>";
  for (const [ccy, c] of Object.entries(cfg.currencies || {}))
    html += `<div class="ccyBox"><h3>${ccy}</h3><div class="fields">` +
      CCY_FIELDS.map(f => fieldHtml(f, `currencies.${ccy}.${f.key}`, c[f.key])).join("") + "</div></div>";
  host.innerHTML = html;
  host.querySelectorAll("input").forEach(el => el.addEventListener("input", buildCfg));
  buildCfg();
}

function buildCfg() {
  const cfg = JSON.parse(JSON.stringify(payload.config));
  document.querySelectorAll("#cfgForm input").forEach(el => {
    const keys = el.dataset.path.split(".");
    let o = cfg;
    for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
    const last = keys[keys.length - 1];
    if (el.type === "checkbox") { o[last] = el.checked; return; }
    const v = Number(el.value);
    o[last] = Number.isFinite(v) ? v : o[last];
    if (el.dataset.rate === "1") {
      const tag = document.getElementById(el.id + "_apr");
      if (tag) tag.textContent = (v * 365).toFixed(1) + "%";
    }
  });
  document.getElementById("cfgJson").value = JSON.stringify(cfg, null, 2);
}

function copyCfg() {
  const ta = document.getElementById("cfgJson");
  navigator.clipboard.writeText(ta.value).then(
    () => alert("設定已複製!\n點「在 GitHub 編輯」,在編輯器中全選(Ctrl+A)貼上,然後 Commit。"),
    () => { ta.removeAttribute("readonly"); ta.select(); alert("請手動複製上方內容"); });
}

document.getElementById("cfgPw").addEventListener("keydown", e => { if (e.key === "Enter") unlockSettings(); });

refresh();
setInterval(refresh, 300000); // 每 5 分鐘自動更新
</script>
</body>
</html>
